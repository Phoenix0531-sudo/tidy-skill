<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidy Skill motion — dots place, ready lights">
  <!-- Animated motion source (SMIL spec kept as editable reference).
     resvg does not run SMIL timelines, so the GIF is rendered frame-by-frame
     by tools/render_motion_frames.js. Timeline:
       0.0-0.5s  shallow cradle arc draws in
       0.5-0.9s  first slate dot drops onto the arc
       0.9-1.3s  second slate dot drops onto the arc
       1.3-1.9s  sage "ready" focal dot pops (slightly larger) at the right
       1.9-2.5s  hold -->
  <rect width="512" height="512" fill="#f7f8f9"/>
  <path id="cradle" pathLength="100"
        d="M150 340 Q256 300 362 340" fill="none" stroke="#c0c8d2" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.5s" begin="0s" fill="freeze"/>
  </path>
  <circle id="dot1" cx="184" cy="256" r="0" fill="#2b3a47">
    <animate attributeName="r" from="0" to="38" dur="0.4s" begin="0.5s" fill="freeze"
             keyTimes="0;0.6;1" values="0;42;38" calcMode="spline"
             keySplines="0.2 0.8 0.4 1; 0.4 0 0.6 1"/>
  </circle>
  <circle id="dot2" cx="256" cy="216" r="0" fill="#2b3a47">
    <animate attributeName="r" from="0" to="42" dur="0.4s" begin="0.9s" fill="freeze"
             keyTimes="0;0.6;1" values="0;46;42" calcMode="spline"
             keySplines="0.2 0.8 0.4 1; 0.4 0 0.6 1"/>
  </circle>
  <circle id="dot3" cx="328" cy="176" r="0" fill="#3f9d7a">
    <animate attributeName="r" from="0" to="52" dur="0.6s" begin="1.3s" fill="freeze"
             keyTimes="0;0.6;1" values="0;58;52" calcMode="spline"
             keySplines="0.2 0.8 0.4 1; 0.4 0 0.6 1"/>
  </circle>
</svg>
