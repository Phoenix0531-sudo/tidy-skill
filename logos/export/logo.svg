<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidy Skill — three dots, the third is ready">
  <!-- Iteration 7c-2: 16px fidelity pass.
       - slate dots now fully opaque and slightly larger so they survive at favicon
       - cradle arc a touch heavier (still light)
       - sage dot remains the focal (biggest, saturated)
       Background stays paper-white for the light/airy brief. -->
  <rect width="512" height="512" fill="#f7f8f9"/>
  <g id="icon">
    <!-- shallow cradle: the tidy line holding the three layers in order -->
    <path d="M150 340 Q256 300 362 340" fill="none" stroke="#c0c8d2" stroke-width="14" stroke-linecap="round"/>
    <!-- three dots: repo / workspace / machine; third is sage and focal -->
    <circle cx="184" cy="256" r="38" fill="#2b3a47"/>
    <circle cx="256" cy="216" r="42" fill="#2b3a47"/>
    <circle cx="328" cy="176" r="52" fill="#3f9d7a"/>
  </g>
</svg>
