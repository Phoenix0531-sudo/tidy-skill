<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidy Skill — three-layer hygiene prism">
  <!-- Iteration of 6a: Tier heights normalized; amber "placed" dot moved onto
       the top tier's right end so it reads as a check point, not a stray mark.
       Tier tints tuned so the middle (workspace) tier is the strongest teal. -->
  <g id="icon">
    <rect width="512" height="512" rx="96" fill="#17211d"/>
    <!-- hex prism outer frame -->
    <path d="M256 56 L424 152 L424 360 L256 456 L88 360 L88 152 Z"
          fill="none" stroke="#fffdf8" stroke-width="22" stroke-linejoin="round"/>
    <!-- inner facet tint -->
    <path d="M256 118 L376 186 L376 326 L256 394 L136 326 L136 186 Z"
          fill="#0f6b5f" opacity="0.20"/>
    <!-- three tidy tiers: repo (top), workspace (middle, widest/strongest), machine (bottom) -->
    <rect x="168" y="206" width="176" height="34" rx="10" fill="#0f6b5f" opacity="0.55"/>
    <rect x="144" y="248" width="224" height="34" rx="10" fill="#0f6b5f" opacity="0.85"/>
    <rect x="168" y="290" width="176" height="34" rx="10" fill="#0f6b5f" opacity="0.55"/>
    <!-- amber "placed/checked" dot on the top-tier right end -->
    <circle cx="312" cy="223" r="18" fill="#c07a22"/>
    <circle cx="312" cy="223" r="6" fill="#fffdf8"/>
  </g>
</svg>
