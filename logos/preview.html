<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Preview — Final</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem;
    transition: background-color 0.3s, color 0.3s;
  }
  body.light { background: #f5f5f5; color: #333; }
  body.dark { background: #1a1a1a; color: #eee; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  h1 { font-size: 1.5rem; font-weight: 600; }
  .toggle {
    padding: 0.5rem 1rem;
    border: 1px solid currentColor;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.875rem;
  }
  .final { display: flex; flex-direction: column; gap: 1.5rem; align-items: center; }
  .stage {
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .stage-img {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  body.light .stage-img { background: #fff; }
  body.dark .stage-img { background: #2a2a2a; }
  .stage-img svg { max-width: 320px; max-height: 320px; }
  .stage-label {
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-top: 1px solid rgba(128, 128, 128, 0.3);
  }
  body.light .stage-label { background: #fafafa; }
  body.dark .stage-label { background: #222; }
  h2.favicon { margin-top: 2rem; font-size: 1rem; font-weight: 600; margin-bottom: 1rem; align-self: flex-start; }
</style>
</head>
<body class="light">
  <div class="header">
    <h1>Logo Preview — Final (iteration-1)</h1>
    <button class="toggle" onclick="document.body.classList.toggle('dark'); document.body.classList.toggle('light'); this.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';">🌙 Dark</button>
  </div>
  <div class="final">
    <div class="stage">
      <div class="stage-img">
        <img src="export/logo-512.svg" alt="logo" width="320" onerror="this.onerror=null;this.src='export/logo.svg';this.removeAttribute('width')">
      </div>
      <div class="stage-label">Final — Tidy box + clean check + amber "lit-clean" dot</div>
    </div>

    <h2 class="favicon">Favicon Size Check</h2>
    <div style="display:flex;gap:2rem;flex-wrap:wrap;align-items:end;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
        <div style="font-size:0.8rem;font-weight:500;">iteration-1</div>
        <div style="display:flex;gap:1rem;align-items:end;">
          <div><img src="export/logo-64.png" width="64" height="64" onerror="this.onerror=null;this.src='export/logo-48.png'"><div style="font-size:0.75rem;opacity:0.6;">64px</div></div>
          <div><img src="export/logo-32.png" width="32" height="32"><div style="font-size:0.75rem;opacity:0.6;">32px</div></div>
          <div><img src="export/logo-16.png" width="16" height="16"><div style="font-size:0.75rem;opacity:0.6;">16px</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
