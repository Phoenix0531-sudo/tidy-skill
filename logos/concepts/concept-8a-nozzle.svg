<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidy Skill — nozzle sucking debris into clean">
  <!-- Concept 8a: vacuum nozzle (top) sucking a stream of debris upward;
       the dot already entering the nozzle turns sage = "just cleaned".
       Minimal line-art on paper-white. Nozzle geometry:
         - a trapezoidal suction head (wide bottom, narrow top) + a short neck
         - the debris stream compresses as it rises and converges into the head
  -->
  <rect width="512" height="512" fill="#f7f8f9"/>
  <g id="icon" fill="none" stroke="#2b3a47" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- nozzle neck going up off-frame (the vacuum body is implied, not drawn) -->
    <path d="M256 168 L256 104"/>
    <!-- nozzle head: trapezoid, wide base facing the debris -->
    <path d="M196 168 L316 168 L292 224 L220 224 Z"/>
    <!-- suction slot (the mouth) -->
    <path d="M224 224 L288 224"/>
  </g>
  <!-- debris stream: scattered below, converging upward into the slot -->
  <g id="debris" stroke="#2b3a47" stroke-width="12" stroke-linecap="round">
    <!-- widest scattered bottom -->
    <path d="M150 376 L156 360"/>
    <path d="M210 396 L208 376"/>
    <path d="M256 406 L256 386"/>
    <path d="M302 396 L304 376"/>
    <path d="M362 376 L356 360"/>
    <!-- converging middle, shorter and angled inward -->
    <path d="M196 336 L212 318"/>
    <path d="M316 336 L300 318"/>
    <!-- near-slot, almost merged -->
    <path d="M236 286 L244 270"/>
    <path d="M276 286 L268 270"/>
  </g>
  <!-- the dot just entering the nozzle mouth = sage "cleaned" -->
  <circle cx="256" cy="248" r="9" fill="#3f9d7a" stroke="none"/>
</svg>
