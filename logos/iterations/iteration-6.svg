<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidy-Skill — upright vacuum sweeping chaos into order, pure black on white">
  <!--
    Pure black & white, no check, no GIF. Vacuum skeleton follows the industry
    upright-vacuum convention (MDI /api/.../mdi/vacuum.svg):
      - a round roller base (the strongest "it's a vacuum" tell)
      - a long straight wand rising diagonally
      - an L-bend handle at the top
    Drawn as SOLID silhouette (not stroke) for logo weight. Then:
      - ahead of the roller base (lower-left): dense scattered chaos cluster
      - behind the handle (upper-right): sparse aligned order dots + sparkles
  -->
  <rect width="512" height="512" rx="96" fill="#ffffff"/>

  <!-- ===== VACUUM =====
       roller base at (140,360); wand rises to (300,170); L-handle to (380,170).
       Nozzle mouth faces lower-left. -->
  <g id="vacuum" fill="#000000">
    <!-- roller base: rounded body with a small mouth slit nub facing lower-left -->
    <g transform="translate(140 360) rotate(-30)">
      <rect x="-86" y="-46" width="142" height="92" rx="46"/>
      <!-- suction mouth slit on the leading edge -->
      <rect x="-94" y="-10" width="18" height="20" rx="6" fill="#ffffff"/>
    </g>
    <!-- wand: thick straight line from roller up to L-bend (handle base) -->
    <path d="M196 322 L300 170" stroke="#000000" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- L-bend handle: short horizontal stub to upper-right -->
    <path d="M300 170 L386 170" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none"/>
    <!-- handle grip end (small thicker cap) -->
    <rect x="382" y="158" width="14" height="24" rx="7"/>
  </g>

  <!-- ===== CHAOS: dense, scattered, ahead of the mouth (lower-left) ===== -->
  <g id="chaos" stroke="#000000" fill="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="44,360 70,360 57,336" fill="none"/>
    <rect x="30" y="394" width="26" height="26" fill="none"/>
    <path d="M76 386 h24 M88 374 v24"/>
    <path d="M26 428 q7 -11 14 0 t14 0" fill="none" stroke-width="5"/>
    <circle cx="70" cy="434" r="4"/>
    <circle cx="102" cy="410" r="3.5"/>
    <circle cx="54" cy="428" r="2.8"/>
    <circle cx="86" cy="356" r="3"/>
    <path d="M12 374 q4 -6 8 0 t8 0" fill="none" stroke-width="4"/>
  </g>

  <!-- ===== ORDER: sparse, aligned, behind the handle (upper-right) ===== -->
  <g id="order" fill="#000000">
    <circle cx="416" cy="230" r="7"/>
    <circle cx="448" cy="230" r="7"/>
    <circle cx="480" cy="230" r="7"/>
    <path d="M462 92 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z"/>
    <path d="M404 116 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" opacity="0.7"/>
  </g>
</svg>
