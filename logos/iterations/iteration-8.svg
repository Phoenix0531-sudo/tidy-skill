<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidy-Skill — broom sweeping scattered chaos into ordered dots, pure black on white">
  <!--
    Broom silhouette: the canonical Phosphor `ph/broom` MIT path used verbatim
    (no redraw — proven recognizable silhouette). Scaled from 256 to 448 inside
    a 512 card, centered. Chaos (sparse scattered △□+~ dots) sits BEYOND the
    broom head (lower-right, where the sweep has not reached); order (aligned
    sparse dots + tiny sparkles) sits BEHIND the handle root (upper-left, where
    the sweep has passed). Pure black on white, no check, no GIF.
  -->
  <rect width="512" height="512" rx="96" fill="#ffffff"/>

  <!-- ===== BROOM (ph/broom MIT, scaled 1.75x: 256→448, centered) ===== -->
  <g transform="translate(32 32) scale(1.75)" fill="#000000">
    <path d="M235.5 216.81c-22.56-11-35.5-34.58-35.5-64.8v-17.28a15.94 15.94 0 0 0-10.09-14.87L165 110a8 8 0 0 1-4.48-10.34l21.32-53a28 28 0 0 0-16.1-37a28.14 28.14 0 0 0-35.82 16a.6.6 0 0 0 0 .12L108.9 79a8 8 0 0 1-10.37 4.49L73.11 73.14a15.89 15.89 0 0 0-17.37 3.66C34.68 98.45 24 123.75 24 152a111.45 111.45 0 0 0 31.18 77.53A8 8 0 0 0 61 232h171a8 8 0 0 0 3.5-15.19M67.14 88l25.41 10.3a24 24 0 0 0 31.23-13.45l21-53c2.56-6.11 9.47-9.27 15.43-7a12 12 0 0 1 6.88 15.92l-21.4 52.99a24 24 0 0 0 13.43 31.14l24.88 9.83V153L55.77 101.71A109 109 0 0 1 67.14 88m48 128a87.53 87.53 0 0 1-24.34-42a8 8 0 0 0-15.49 4a105.2 105.2 0 0 0 18.36 38H64.44A95.54 95.54 0 0 1 40 152a85.9 85.9 0 0 1 7.73-36.29l137.8 55.12c3 18 10.56 33.48 21.89 45.16Z"/>
  </g>

  <!-- ===== CHAOS: beyond the broom head (lower-right corner = un-swept) ===== -->
  <g id="chaos" stroke="#000000" fill="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="466,398 492,398 479,376" fill="none"/>
    <rect x="442" y="430" width="22" height="22" fill="none"/>
    <path d="M462 432 h18 M471 422 v18"/>
    <path d="M498 450 q5 -8 10 0 t10 0" fill="none" stroke-width="3.7"/>
    <circle cx="478" cy="424" r="3.3"/>
    <circle cx="502" cy="408" r="2.8"/>
    <path d="M444 408 q4 -6 8 0 t8 0" fill="none" stroke-width="3.4"/>
  </g>

  <!-- ===== ORDER: behind the handle root (upper-left = already swept) ===== -->
  <g id="order" fill="#000000">
    <circle cx="30" cy="246" r="6.5"/>
    <circle cx="30" cy="280" r="6.5"/>
    <circle cx="30" cy="314" r="6.5"/>
    <path d="M60 64 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z"/>
  </g>
</svg>
