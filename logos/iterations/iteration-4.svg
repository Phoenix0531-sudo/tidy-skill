<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidy Skill — vacuum nozzle sucking a debris stream, the entering dot is clean">
  <!-- 8c-3 final: nozzle silhouette wide (favicon-readable), sage focal
       repositioned to the stream tip just below the slot (doesn't squeeze
       the mouth). Sage is the big-picture beat; favicon reads nozzle+stream. -->
  <rect width="512" height="512" fill="#f7f8f9"/>
  <g id="icon">
    <!-- nozzle neck going up -->
    <rect x="232" y="94" width="48" height="70" rx="8" fill="#2b3a47"/>
    <!-- nozzle head: solid trapezoid, wide suction base -->
    <path d="M176 164 L336 164 L300 236 L212 236 Z" fill="#2b3a47"/>
    <!-- suction mouth slot -->
    <rect x="220" y="222" width="72" height="20" rx="6" fill="#f7f8f9"/>
    <!-- one converging debris stream: tapering wedge, narrower near slot -->
    <path d="M182 392 L330 392 L286 260 L226 260 Z" fill="#5a6b78" opacity="0.92"/>
    <!-- sage "cleaned" dot at the stream tip just entering the slot -->
    <circle cx="256" cy="256" r="20" fill="#3f9d7a"/>
  </g>
</svg>
