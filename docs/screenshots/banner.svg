<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Tidy Skill three-layer hygiene model">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="slab1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ecf1"/>
    </linearGradient>
    <linearGradient id="slab2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#d7e6fb"/>
    </linearGradient>
    <linearGradient id="slab3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ee"/>
      <stop offset="100%" stop-color="#f3e1cc"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect x="24" y="18" width="1152" height="244" rx="18" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>

  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" letter-spacing="1.5">THREE-LAYER HYGIENE MODEL</text>
  <text x="600" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Tidy Skill</text>

  <!-- Repository slab -->
  <g filter="url(#soft)">
    <rect x="70" y="118" width="320" height="110" rx="14" fill="url(#slab1)" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="230" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Repository</text>
  <text x="230" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Agent artifacts</text>
  <text x="230" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">plan.md · todo.md · reports</text>

  <!-- Workspace slab -->
  <g filter="url(#soft)">
    <rect x="440" y="118" width="320" height="110" rx="14" fill="url(#slab2)" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="600" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Workspace</text>
  <text x="600" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Dev caches</text>
  <text x="600" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">.venv · node_modules · target</text>

  <!-- Local machine slab -->
  <g filter="url(#soft)">
    <rect x="810" y="118" width="320" height="110" rx="14" fill="url(#slab3)" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="970" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Local machine</text>
  <text x="970" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Environment footprint</text>
  <text x="970" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">WSL2 · Docker · VHDX · models</text>

  <!-- arrows between slabs -->
  <path d="M400 173 H430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M770 173 H800" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="430,168 440,173 430,178" fill="#94a3b8"/>
  <polygon points="800,168 810,173 800,178" fill="#94a3b8"/>
</svg>
