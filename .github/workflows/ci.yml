name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (frozen)
        run: |
          if [ -f uv.lock ]; then
            uv sync --frozen --extra dev || uv sync --frozen
          else
            uv sync --extra dev || uv sync
          fi

      - name: Required project files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md
          test -f pyproject.toml
          test -f skills/tidy-skill/SKILL.md

      - name: Ruff (hard — critical rules)
        run: |
          uv run ruff check . --select E9,F63,F7,F82

      - name: Pytest (hard, tests/ only)
        run: |
          set -e
          if [ -d tests ]; then
            uv run pytest -q tests
          elif [ -d Test ]; then
            uv run pytest -q Test
          else
            echo "No tests/ directory"
            exit 1
          fi

      - name: Fixture evals (1.4 surface)
        run: uv run python tools/run_evals.py

      - name: Doctor gate (self-repo)
        run: uv run python skills/tidy-skill/scripts/tidy_doctor.py --root . --json

      - name: pip-audit (advisory, 3.11 only)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          uv run pip install pip-audit
          uv run pip-audit || true
