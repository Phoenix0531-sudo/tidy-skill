name: Validate

on:
  push:
  pull_request:

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill package
        run: python tools/validate_skill.py --skill-dir skills/tidy-skill
      - name: Run portable repo score
        run: python skills/tidy-skill/scripts/score_repo_hygiene.py --root . --json
      - name: Run portable artifact audit
        run: python skills/tidy-skill/scripts/audit_agent_artifacts.py --root . --json
      - name: Run portable dev environment audit
        run: python skills/tidy-skill/scripts/audit_dev_environment.py --root . --report-path /tmp/tidy_skill_dev_environment.md --json
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  windows-smoke:
    name: Windows PowerShell smoke tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill package
        run: python tools/validate_skill.py --skill-dir skills/tidy-skill
      - name: Score repo
        shell: pwsh
        run: .\skills\tidy-skill\scripts\score-repo-hygiene.ps1 -Root . -ReportPath "$env:TEMP\tidy_skill_score.md"
      - name: Audit artifacts
        shell: pwsh
        run: .\skills\tidy-skill\scripts\audit-agent-artifacts.ps1 -Root . -ReportPath "$env:TEMP\tidy_skill_artifacts.md"
      - name: Audit dev environment
        shell: pwsh
        run: .\skills\tidy-skill\scripts\audit-dev-environment.ps1 -Roots . -ReportPath "$env:TEMP\tidy_skill_dev_environment.md"
      - name: Cleanup dry run
        shell: pwsh
        run: .\skills\tidy-skill\scripts\clean-agent-artifacts.ps1 -Root . -DryRun
      - name: Local install dry run
        shell: pwsh
        run: .\skills\tidy-skill\scripts\install-local.ps1 -SelfCheckOnly
      - name: Template install dry run
        shell: pwsh
        run: .\skills\tidy-skill\scripts\install-rule-template.ps1 -TargetRoot . -Template all
      - name: Cleanup safety tests
        continue-on-error: true
        shell: pwsh
        run: .\tests\test-clean-agent-artifacts.ps1
